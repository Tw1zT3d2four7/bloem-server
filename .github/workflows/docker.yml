name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - apiv2
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and Publish Image
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::12}"

          {
            echo "image=$IMAGE"
            echo "sha_tag=$IMAGE:sha-$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "$IMAGE:sha-$SHORT_SHA"

            if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              echo "$IMAGE:latest"
            elif [[ "$GITHUB_REF_NAME" == "apiv2" ]]; then
              echo "$IMAGE:apiv2"
            else
              BRANCH_TAG="$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')"
              echo "$IMAGE:$BRANCH_TAG"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DIRTY=false
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Verify published image
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ steps.meta.outputs.sha_tag }}"
